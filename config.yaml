# Konfiguracja doc-agents. Ścieżki względne liczone od położenia tego pliku.
# Klucz i adres endpointu NIE są tu zapisane - config trzyma tylko nazwy zmiennych środowiskowych.

llm:
  profiles:
    small:
      provider: openai_compatible
      model: claude-haiku-5-5
      api_key_env: LLM_API_KEY
      base_url_env: LLM_BASE_URL
      structured_output_method: function_calling
      params: { max_tokens: 4096 }
    medium:
      provider: openai_compatible
      model: claude-sonnet-5-5
      api_key_env: LLM_API_KEY
      base_url_env: LLM_BASE_URL
      structured_output_method: json_schema   # ustalone przez probe_llm: ten model odrzuca wymuszony tool_choice
      params: { max_tokens: 8192 }
  agents:
    planner: small
    analyst: small
    editor: small
    reviewer: small

paths:
  prompts: prompts
  knowledge_base: knowledge_base
  runs: runs

scan:
  # Wzorce nazw plików i katalogów pomijanych przy skanowaniu projektu (styl powłoki: * ? [abc]),
  # porównywane z samą nazwą, nie ze ścieżką. Pasujący katalog jest pomijany razem z zawartością.
  # Środowiska wirtualne (katalogi z pyvenv.cfg) skaner pomija zawsze, niezależnie od tej listy.
  ignore:
    - .git
    - .svn
    - __pycache__
    - .pytest_cache
    - .mypy_cache
    - .idea
    - .vscode
    - .vs
    - node_modules
    - venv
    - .venv
    - "*.pyc"
    - Thumbs.db
    - desktop.ini
    - "~$*"

  # Pliki z sekretami (certyfikaty, klucze, .env): do modelu trafiają tylko metadane (nazwa, rozmiar),
  # nigdy treść - skaner nawet ich nie otwiera. Sprawdzane jako pierwsze, wygrywają z każdą inną regułą.
  secret_patterns: ["*.pfx", "*.p12", "*.pem", "*.key", "*.crt", ".env*"]
  # Role plików innych niż kod źródłowy (kod rozpoznaje technologia projektu, np. .py dla Pythona).
  # Kolejność ról ma znaczenie - wygrywa pierwsza pasująca (np. requirements*.txt jako config przed *.txt jako data).
  # Plik niepasujący do niczego: binary, jeśli wygląda na binarny (bajt zerowy w pierwszych 8 KB), inaczej other.
  role_patterns:
    config: ["*.yml", "*.yaml", "*.json", "*.toml", "*.ini", "*.cfg", "*.conf", "*.config", "requirements*.txt", ".git*"]
    docs: ["*.md", "*.rst", "README*", "*.docx", "*.doc", "*.pdf", "*.pptx"]
    data: ["*.csv", "*.tsv", "*.txt", "*.xlsx", "*.xlsm", "*.xls", "*.db", "*.sqlite", "*.xml", "*.log"]
    binary: ["*.png", "*.jpg", "*.jpeg", "*.gif", "*.bmp", "*.ico", "*.exe", "*.dll", "*.zip", "*.7z", "*.whl", "*.jar"]
  # Framework skopiowany do katalogu projektu (nie kod robota): nazwa frameworku -> wzorce ścieżek względnych.
  # Wzorce porównywane z całą ścieżką z separatorem "/"; * obejmuje też podkatalogi.
  # Framework instalowany jako pakiet (pip) nie leży w projekcie - widać go tylko w importach, tu go nie wpisujemy.
  # Przykład:  frameworks: { roboforge: ["roboforge_framework/*"], reframework: ["Framework/*"] }
  frameworks: {}
